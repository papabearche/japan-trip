<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tokyo Trip 2026</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Config for Muji Style -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        muji: {
                            bg: '#F5F5F3',      /* 米白背景 */
                            card: '#FFFFFF',    /* 卡片白 */
                            text: '#44403C',    /* 深灰字 (Stone-700) */
                            sub: '#78716C',     /* 次要字 (Stone-500) */
                            accent: '#7F1D1D',  /* 點綴紅 (接近印泥色) */
                            border: '#E7E5E4',  /* 邊框 (Stone-200) */
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                        mono: ['"Roboto Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F5F5F3;
            color: #44403C;
            -webkit-tap-highlight-color: transparent;
        }
        /* 隱藏捲軸但保持功能 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 卡片按壓效果 */
        .btn-press:active {
            transform: scale(0.98);
            background-color: #E7E5E4;
        }
        /* 載入動畫 */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-muji-border h-14 flex items-center justify-center fixed top-0 w-full z-50 shadow-sm">
        <h1 class="text-lg font-bold tracking-widest text-muji-text">TOKYO 2026</h1>
    </header>

    <!-- Main Content Area -->
    <main id="main-container" class="flex-1 overflow-y-auto pt-16 pb-24 px-4 hide-scrollbar">
        <!-- Default Loading State -->
        <div class="flex flex-col items-center justify-center h-full text-muji-sub space-y-4">
            <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
            <p class="text-sm tracking-widest">正在載入行程...</p>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-white border-t border-muji-border h-16 fixed bottom-0 w-full z-50 flex justify-around items-center shadow-[0_-2px_10px_rgba(0,0,0,0.02)]">
